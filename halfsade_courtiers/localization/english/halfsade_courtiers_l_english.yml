 halfsade_courtiers_choose_button:0 "Choose Position"
 halfsade_courtiers_recruit_decision_effect_tt:0 "In 20 days a courtier with high aptitude will arrive and take the chosen position. The same position cannot be recruited again for 1 year."
 halfsade_courtiers_arrived_title:0 "Courtier Arrived"
 halfsade_courtiers_arrived_desc:0 "A new courtier has arrived at court and taken up their post:"
 halfsade_courtiers_failed_title:0 "No Suitable Candidate"
 halfsade_courtiers_failed_desc:0 "My agents returned empty-handed; no suitable candidate could be found. Any gold paid was refunded."

